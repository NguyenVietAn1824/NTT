# Object storage khi phát triển: MinIO (tương thích S3 / Cloudflare R2)
#   docker compose -f docker-compose.dev.yml up -d
# S3 API: http://localhost:9000  ·  Giao diện quản lý: http://localhost:9001  (ntt / ntt-dev-secret)
# Bucket "ntt-media" do backend tự tạo khi khởi động (S3_AUTO_CREATE_BUCKET=true).
#
# MinIO đã ngừng phát hành image chính thức trên Docker Hub/quay.io (2025) → dùng bản Chainguard
# build từ mã nguồn, ghim digest (MinIO RELEASE.2026-09-22T19-25-18Z).
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ntt
      MINIO_ROOT_PASSWORD: ntt-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  minio-data:
